name: OpenHands Resolver
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to resolve"
        required: true
        type: string

jobs:
  resolve:
    if: github.event.label.name == 'openhands'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Resolve with OpenHands Resolver
        uses: All-Hands-AI/openhands-resolver@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          llm_model: "openai/glm-5.3-flash"
          llm_base_url: "https://api.b.ai/v1"
          llm_api_key: ${{ secrets.OPENHANDS_LLM_KEY }}
          max_iterations: 50
